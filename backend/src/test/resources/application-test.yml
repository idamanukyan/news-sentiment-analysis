spring:
  datasource:
    # Testcontainers will override this via @ServiceConnection
    url: jdbc:postgresql://localhost:5432/testdb
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: simple

  mail:
    host: localhost
    port: 25

jwt:
  secret: test-secret-key-for-testing-purposes-minimum-32-chars
  expiration: 86400000

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false
