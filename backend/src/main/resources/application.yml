spring:
  application:
    name: aiim-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:newssentiment}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: none  # Using Flyway for schema management
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  tomcat:
    max-threads: 200
    accept-count: 100
    connection-timeout: 20000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-min-32-chars}
  expiration: ${JWT_EXPIRATION:28800000}  # 8 hours

# Application Configuration
app:
  name: AIIM
  version: 1.0.0

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

  scraping:
    interval-minutes: ${SCRAPE_INTERVAL:15}
    max-articles-per-source: 50
    timeout-seconds: 30

  sentiment:
    api-url: ${SENTIMENT_API_URL:http://localhost:8000}
    timeout-seconds: 30

  rate-limiting:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:60}

  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-3-haiku-20240307
    relevance:
      threshold: ${RELEVANCE_THRESHOLD:0.65}
      batch-size: ${RELEVANCE_BATCH_SIZE:20}
      max-per-run: ${RELEVANCE_MAX_PER_RUN:200}

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    redis:
      enabled: true
    db:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Info endpoint
info:
  app:
    name: AIIM - Armenia Information Integrity Monitor
    description: Election monitoring and disinformation detection platform
    version: 1.0.0
  build:
    artifact: aiim-api
    name: AIIM API

# Logging
logging:
  level:
    root: INFO
    com.newssentiment: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_PATH:logs}/aiim-api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.newssentiment: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

server:
  error:
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: WARN
    com.newssentiment: INFO
    org.springframework: WARN

---
# Demo Profile
spring:
  config:
    activate:
      on-profile: demo

logging:
  level:
    com.newssentiment: INFO
    org.hibernate.SQL: WARN
