<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield/Monitor icon -->
  <g transform="translate(30, 20)">
    <!-- Outer shield shape -->
    <path d="M80 10 L145 35 L145 95 Q145 140 80 165 Q15 140 15 95 L15 35 Z" 
          fill="url(#brandGrad)" rx="4"/>
    
    <!-- Inner monitor/screen -->
    <rect x="35" y="45" width="90" height="60" rx="4" fill="#ffffff" opacity="0.95"/>
    
    <!-- Signal/data lines inside screen -->
    <polyline points="45,85 55,75 65,80 75,60 85,70 95,55 105,65 115,58" 
              stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Small dot indicators -->
    <circle cx="50" cy="55" r="3" fill="#22c55e"/>
    <circle cx="62" cy="55" r="3" fill="#f59e0b"/>
    <circle cx="74" cy="55" r="3" fill="#ef4444"/>
    
    <!-- Integrity checkmark at bottom of shield -->
    <polyline points="65,125 77,137 100,110" 
              stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AIIM Text -->
  <text x="210" y="125" font-family="'Georgia', 'Times New Roman', serif" font-size="96" font-weight="bold" fill="#1e3a5f" letter-spacing="8">
    AIIM
  </text>
  
  <!-- Accent bar under text -->
  <rect x="210" y="138" width="120" height="4" rx="2" fill="url(#accentGrad)"/>
  
  <!-- Subtitle -->
  <text x="210" y="168" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="16" fill="#64748b" letter-spacing="3.5">
    ARMENIA INFORMATION INTEGRITY MONITOR
  </text>
</svg>